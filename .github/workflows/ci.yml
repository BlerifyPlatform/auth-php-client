name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    name: Conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch name
        run: |
          BRANCH_NAME=$(echo "${{ github.head_ref }}")
          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix|release|chore|test|experiment|refactor)/.+$ ]]; then
            echo "::error::Invalid branch name: $BRANCH_NAME"
            exit 1
          fi

      - name: Validate commit messages
        run: |
          echo "Validating commit messages in PR"

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Commit range: $BASE_SHA..$HEAD_SHA"
          COMMITS=$(git rev-list $BASE_SHA..$HEAD_SHA)

          REGEX='^((feat|fix|chore|docs|style|refactor|test|build|perf|revert)\([^)]+\):\s*[a-z].+|Merge branch .+|Merge pull request #[0-9]+ from .+|Merge remote-tracking branch '\''.+'\'' into .+|Revert "Merge pull request #[0-9]+ from .+")$'

          for COMMIT in $COMMITS; do
            MSG=$(git log --format=%s -n 1 "$COMMIT")
            echo "Checking: $MSG"
            if ! echo "$MSG" | grep -Eq "$REGEX"; then
              echo "::error::Invalid commit message: '$MSG'"
              echo "Expected format: type(scope): lowercase description"
              exit 1
            fi
          done
          echo "All commit messages are valid."

  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, mbstring, curl, openssl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test
